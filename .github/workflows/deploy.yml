name: Deploy

# Builds the platform image, pushes it to GitHub's registry, and (when a server is configured)
# rolls it out there over SSH. Repository settings, under Secrets and variables → Actions:
#   variables: VPS_HOST, VPS_USER, optional VPS_PORT (22), VPS_PATH (/opt/rialto) and SOLANA_NETWORK (devnet | mainnet)
#   secrets:   VPS_SSH_KEY, optional VPS_KNOWN_HOSTS (output of `ssh-keyscan <host>`)
# Without VPS_HOST the image is still built and pushed; nothing is deployed.

on:
  push:
    branches: [main]
    paths-ignore:
      - "video/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build and push the image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SOLANA_NETWORK=${{ vars.SOLANA_NETWORK || 'devnet' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Roll out on the server
    needs: image
    if: vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.VPS_HOST }}
      USER_NAME: ${{ vars.VPS_USER }}
      PORT: ${{ vars.VPS_PORT || '22' }}
      DIR: ${{ vars.VPS_PATH || '/opt/rialto' }}
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
      - name: Copy the compose file
        run: scp -i ~/.ssh/id_deploy -P "$PORT" deploy/docker-compose.yml "$USER_NAME@$HOST:$DIR/docker-compose.yml"
      - name: Configure account email when a sending key is supplied
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || 'Rialto <no-reply@galleriarialto.com>' }}
        run: |
          set -euo pipefail
          if [ -z "$RESEND_API_KEY" ]; then
            echo "No email secret supplied; keeping the server's existing email settings."
            exit 0
          fi
          config=$(mktemp)
          trap 'rm -f "$config"' EXIT
          chmod 600 "$config"
          python3 - "$config" <<'PY'
          import json, os, sys
          with open(sys.argv[1], "w") as f:
              json.dump({"RESEND_API_KEY": os.environ["RESEND_API_KEY"], "EMAIL_FROM": os.environ["EMAIL_FROM"], "EMAIL_TRANSPORT": "resend"}, f)
          PY
          scp -p -i ~/.ssh/id_deploy -P "$PORT" "$config" "$USER_NAME@$HOST:$DIR/.email-runtime.json"
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER_NAME@$HOST" "DIR='$DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DIR"
          trap 'rm -f .email-runtime.json' EXIT
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          updates = json.loads(Path(".email-runtime.json").read_text())
          env = Path(".env")
          lines = env.read_text().splitlines()
          kept = [line for line in lines if line.split("=", 1)[0].strip() not in updates]
          staged = Path(".env.email-next")
          fd = os.open(staged, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w") as f:
              f.write("\n".join(kept + [key + "=" + json.dumps(value) for key, value in updates.items()]) + "\n")
          os.chmod(staged, 0o600)
          os.replace(staged, env)
          PY
          REMOTE
      - name: Back up, switch to the new image, roll back if it is not healthy
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER_NAME@$HOST" \
            "DIR='$DIR' IMAGE='$IMAGE:$TAG' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DIR"
          previous=$(grep '^IMAGE=' .env | cut -d= -f2- || true)
          echo "now: ${previous:-none}  next: $IMAGE"
          # a copy of the database before anything changes (kept with the nightly ones)
          docker compose exec -T app npm run -s db:backup | tail -1 || echo "no running app to back up"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          docker pull --quiet "$IMAGE" >/dev/null
          docker logout ghcr.io >/dev/null
          set_image() {
            if grep -q '^IMAGE=' .env; then sed -i "s|^IMAGE=.*|IMAGE=$1|" .env; else echo "IMAGE=$1" >> .env; fi
            chmod 600 .env
          }
          healthy() {
            for _ in $(seq 1 40); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)" 2>/dev/null || echo starting)
              [ "$status" = healthy ] && return 0
              sleep 3
            done
            return 1
          }
          # the image is recorded in .env, so a later `docker compose up` keeps running this version
          set_image "$IMAGE"
          docker compose up -d --remove-orphans
          if healthy; then
            echo "app is healthy on $IMAGE"
            docker image prune -f >/dev/null
            exit 0
          fi
          echo "the new version did not become healthy: its log, then back to $previous"
          docker compose logs --tail 80 app
          if [ -n "$previous" ]; then
            set_image "$previous"
            docker compose up -d --remove-orphans
            healthy && echo "rolled back to $previous" || echo "ROLLBACK DID NOT BECOME HEALTHY EITHER"
          fi
          exit 1
          REMOTE
      - name: Check the public site
        run: |
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://galleriarialto.com/api/health || true)
            [ "$code" = 200 ] && { echo "galleriarialto.com answers 200"; exit 0; }
            sleep 3
          done
          echo "galleriarialto.com did not answer 200"; exit 1
